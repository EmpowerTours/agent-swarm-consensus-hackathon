<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Swarm - Live Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .demo-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        
        .intent-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .intent-card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        
        .intent-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .detail-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .detail-item label {
            display: block;
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .detail-item .value {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .start-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #666;
            display: none;
        }
        
        .status.active {
            display: block;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .agent-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            opacity: 0.5;
        }
        
        .agent-card.active {
            opacity: 1;
            transform: scale(1.02);
        }
        
        .agent-card.winner {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border: 3px solid #f39c12;
        }
        
        .agent-card .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .agent-card.winner .badge {
            background: #f39c12;
            color: white;
        }
        
        .agent-card h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #2d3436;
        }
        
        .agent-card .strategy {
            font-size: 0.9em;
            color: #636e72;
            margin-bottom: 20px;
        }
        
        .bid-details {
            display: grid;
            gap: 10px;
        }
        
        .bid-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .bid-row:last-child {
            border-bottom: none;
        }
        
        .bid-label {
            font-weight: 600;
            color: #2d3436;
        }
        
        .bid-value {
            font-weight: bold;
            color: #0984e3;
        }
        
        .winner-section {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            display: none;
        }
        
        .winner-section.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .winner-section h2 {
            font-size: 2.5em;
            color: #2d3436;
            margin-bottom: 20px;
        }
        
        .winner-section .savings {
            font-size: 3em;
            color: #00b894;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .tx-link {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .tx-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .price-feed {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .price-item {
            text-align: center;
        }
        
        .price-item .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .price-item .price {
            font-size: 1.3em;
            font-weight: bold;
            color: #2d3436;
        }
        
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00b894;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agent Swarm</h1>
            <p>AI Agents Competing for Your Best Swap</p>
            <p style="font-size: 0.9em; margin-top: 10px;">EasyA Consensus Hackathon 2026 • Built on Monad</p>
        </div>
        
        <div class="demo-section">
            <div class="intent-card">
                <h2>💎 User Intent</h2>
                <div class="intent-details">
                    <div class="detail-item">
                        <label>From</label>
                        <div class="value">1 MON</div>
                    </div>
                    <div class="detail-item">
                        <label>To</label>
                        <div class="value">USDC</div>
                    </div>
                    <div class="detail-item">
                        <label>Chain</label>
                        <div class="value">Ethereum</div>
                    </div>
                    <div class="detail-item">
                        <label>Value</label>
                        <div class="value">$5.00</div>
                    </div>
                </div>
            </div>
            
            <div class="price-feed" id="priceFeed" style="display: none;">
                <div class="price-item">
                    <div class="label"><span class="live-indicator"></span>Live Prices</div>
                </div>
                <div class="price-item">
                    <div class="label">ETH</div>
                    <div class="price" id="ethPrice">-</div>
                </div>
                <div class="price-item">
                    <div class="label">USDC</div>
                    <div class="price" id="usdcPrice">-</div>
                </div>
                <div class="price-item">
                    <div class="label">MON</div>
                    <div class="price" id="monPrice">$5.00</div>
                </div>
            </div>
            
            <button class="start-btn" id="startBtn" onclick="startAuction()">
                🚀 Start Auction
            </button>
            
            <div class="status" id="status"></div>
            
            <div class="agents-grid" id="agentsGrid"></div>
            
            <div class="winner-section" id="winnerSection">
                <h2>🏆 Winner: <span id="winnerName"></span></h2>
                <div class="savings" id="savingsAmount"></div>
                <p style="font-size: 1.2em; color: #2d3436;">Saved vs Traditional DEX</p>
                <a href="#" class="tx-link" id="txLink" target="_blank">View Transaction on Monad Explorer →</a>
            </div>
        </div>
    </div>
    
    <script>
        const AGENTS = {
            conservative: { name: 'Conservative Agent', strategy: 'CHEAP', feePercent: 0.24, executionTime: 180 },
            contrarian: { name: 'Contrarian Agent', strategy: 'SPEEDY', feePercent: 0.36, executionTime: 60 },
            whale: { name: 'Whale Agent', strategy: 'SPEEDY', feePercent: 0.36, executionTime: 60 }
        };
        
        async function startAuction() {
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            const agentsGrid = document.getElementById('agentsGrid');
            const priceFeed = document.getElementById('priceFeed');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Running Auction...';
            status.className = 'status active';
            status.textContent = '📊 Fetching live prices from CoinGecko...';
            
            // Simulate fetching prices
            await sleep(1500);
            priceFeed.style.display = 'flex';
            document.getElementById('ethPrice').textContent = '$1,970';
            document.getElementById('usdcPrice').textContent = '$1.00';
            
            status.textContent = '⏳ Posting intent to Monad blockchain...';
            await sleep(2000);
            
            status.textContent = '🤖 Agents calculating competitive bids...';
            
            // Create agent cards
            agentsGrid.innerHTML = '';
            let index = 0;
            for (const [key, agent] of Object.entries(AGENTS)) {
                await sleep(800);
                const card = createAgentCard(key, agent);
                agentsGrid.appendChild(card);
                
                // Animate activation
                setTimeout(() => {
                    card.classList.add('active');
                }, 100);
                
                index++;
            }
            
            await sleep(2000);
            status.textContent = '✅ Submitting winning bid to smart contract...';
            await sleep(2000);
            
            // Show winner
            const winnerCard = document.querySelector('[data-agent="conservative"]');
            winnerCard.classList.add('winner');
            winnerCard.querySelector('.badge').textContent = '🏆 WINNER';
            
            const winnerSection = document.getElementById('winnerSection');
            winnerSection.classList.add('active');
            document.getElementById('winnerName').textContent = 'Conservative Agent';
            document.getElementById('savingsAmount').textContent = '$0.03';
            document.getElementById('txLink').href = 'https://explorer.monad.xyz/address/0xa3D01411b8331fCcD0Da3011575082361fb97839';
            
            status.textContent = '🎉 Auction complete! Transaction confirmed on Monad.';
            
            btn.innerHTML = '✅ Auction Complete';
            await sleep(2000);
            btn.innerHTML = '🔄 Run Again';
            btn.disabled = false;
        }
        
        function createAgentCard(key, agent) {
            const card = document.createElement('div');
            card.className = 'agent-card';
            card.setAttribute('data-agent', key);
            
            const inputValue = 5; // $5
            const fee = inputValue * (agent.feePercent / 100);
            const outputValue = inputValue - fee;
            
            card.innerHTML = `
                <span class="badge">${agent.strategy}</span>
                <h3>${agent.name}</h3>
                <p class="strategy">${agent.feePercent}% fee • ${agent.executionTime}s execution</p>
                <div class="bid-details">
                    <div class="bid-row">
                        <span class="bid-label">Output:</span>
                        <span class="bid-value">$${outputValue.toFixed(2)} USDC</span>
                    </div>
                    <div class="bid-row">
                        <span class="bid-label">Fee:</span>
                        <span class="bid-value">${agent.feePercent}%</span>
                    </div>
                    <div class="bid-row">
                        <span class="bid-label">Execution:</span>
                        <span class="bid-value">${agent.executionTime}s</span>
                    </div>
                    <div class="bid-row">
                        <span class="bid-label">Route:</span>
                        <span class="bid-value" style="font-size: 0.8em;">Monorail → LayerZero</span>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
